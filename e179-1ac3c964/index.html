<header class="top"><div class="in">

<script>
(function(){
'use strict';
var D=null, app=document.getElementById('app'), player=new Audio(), btnSon=null, cancel=0;
var DIAS=[
 {n:1,id:'dia-1',f:'Lun 23',t:'La base y la sección 1',sec:['intro','s1'],obj:'Las palabras que se repiten en todo el discurso (fantasía, sueño, Reino, realidad) y la introducción completa.',salv:[0,6],pims:[['pims_d1','18 min','?v=3']]},
 {n:2,id:'dia-2',f:'Mar 24',t:'Por qué rechazarlas: Satanás',sec:['s2'],obj:'La cadena de Santiago 1:14, 15 y el ejemplo de Satanás. Ten listos los textos en gujarati.',salv:[6,12],pims:[['pims_d2','19 min','?v=3']]},
 {n:3,id:'dia-3',f:'Mié 25',t:'Materialismo e inmoralidad',sec:['s2b','s2c'],obj:'Los dos casos de hoy. Son los temas con palabras más delicadas: que salgan serenas y sin dudar.',salv:[12,17],pims:[['pims_d3','19 min','?v=3']]},
 {n:4,id:'dia-4',f:'Jue 26',t:'El Reino es real · conclusión',sec:['s3','s4'],obj:'Las 4 preguntas del Reino, las cifras en lakh y la conclusión con Mateo 25:34.',salv:[17,22],pims:[['pims_d4a','Parte 1 · 22 min','?v=3'],['pims_d4b','Parte 2 · 17 min','?v=3']]}
];
function L(k,d){try{var v=localStorage.getItem('i179_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function G(k,v){try{localStorage.setItem('i179_'+k,JSON.stringify(v));}catch(e){}}
function E(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('ver');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('ver');},2000);}
function parar(){cancel++;player.pause();if(btnSon)btnSon.classList.remove('on');btnSon=null;}
function oir(src,btn){return new Promise(function(res){
  if(btnSon)btnSon.classList.remove('on');
  player.pause();player.src=src;btnSon=btn||null;if(btn)btn.classList.add('on');
  var fin=function(){if(btn)btn.classList.remove('on');res(player.duration||2);};
  player.onended=fin;player.onerror=fin;
  var v=L('vel',1);player.playbackRate=v;
  player.play().catch(fin);
});}
function esperar(ms){var c=cancel;return new Promise(function(res,rej){setTimeout(function(){c===cancel?res():rej('x');},ms);});}
function hechos(){return L('hechos',{});}
function malas(){return L('malas',{});}

function nav(){
  var h=location.hash.replace('#','')||'plan', hc=hechos();
  var items=[['plan','Plan']].concat(DIAS.map(function(d){return[d.id,'Día '+d.n+(hc[d.id]?' <span class="ok">✓</span>':'')];}))
    .concat([['estudio','Estudio + Claude'],['simulacro','Viernes · simulacro'],['salvavidas','Salvavidas'],['numeros','Números'],['textos','Textos']]);
  document.getElementById('nav').innerHTML=items.map(function(x){return'<a href="#'+x[0]+'" class="'+(x[0]===h?'on':'')+'">'+x[1]+'</a>';}).join('');
  var on=document.querySelector('nav a.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});
}
function guC(f){return f.partes?f.partes.map(function(p){return E(p.gu);}).join(' <span class="corte">‖</span> '):E(f.gu);}
function frasesDe(secs){return D.frases.filter(function(f){return secs.indexOf(f.sec)>=0;});}

/* ── PLAN ── */
function plan(){
  var hc=hechos();
  var h='<div><div class="eyebrow">Plan de 5 días</div><h1>Que el gujarati te salga antes de pensarlo</h1></div>'+
  '<p class="sub">Interpretación consecutiva: el hermano Sukhjit dice una oración y tú la dices en gujarati. Cada día son unos 35 minutos: vocabulario, escuchar y repetir, interpretar en voz alta y repasar lo que falló. Y un audio de 10 a 15 minutos estilo Pimsleur para oírlo sin pantalla.</p>'+
  '<div class="semana">'+DIAS.map(function(d){return'<a class="dia'+(hc[d.id]?' hecho':'')+'" href="#'+d.id+'"><span class="f">'+d.f+'</span><b>Día '+d.n+'</b><span class="t">'+d.t+'</span></a>';}).join('')+
  '<a class="dia" href="#simulacro"><span class="f">Vie 27</span><b>Día 5</b><span class="t">Simulacro completo y práctica con él</span></a>'+
  '<div class="dia final"><span class="f">Dom 29</span><b>El discurso</b><span class="t">30 minutos · canción 21</span></div></div>'+
  '<h2><small>Lo que dijo en su audio</small>Así va a dar el discurso</h2><div class="panel"><ol class="guia">'+
  '<li>El mundo vive en fantasías: películas, cine, anuncios. Pregunta importante: <i>¿son inofensivas?</i></li>'+
  '<li>Quiénes fantasearon: <b>solo Satanás</b> (quitó Eva y los ángeles) y cómo hoy usa las fantasías para alejarnos de Jehová.</li>'+
  '<li>Dos casos de hoy: <b>el materialismo y la inmoralidad</b> (los dos, sí o sí).</li>'+
  '<li>Busquemos las realidades del Reino, resumido: quién es el Rey (Jesús), quiénes son los súbditos y la cifra de testigos de jw.org.</li>'+
  '<li>La predicación y verse en el nuevo mundo, con una ilustración.</li>'+
  '<li>Conclusión: los que fantasean verán que el Reino ya gobierna. Lee <b>Mateo 25:34</b>: derecha al Reino, izquierda rechazados.</li></ol></div>'+
  '<h2><small>Para el domingo</small>Consejos de cabina</h2><div class="panel"><ul class="tips">'+
  '<li><b>Gestos:</b> él usará la <b>mano izquierda</b> para las malas decisiones (Satanás) y la <b>derecha</b> para lo bueno. Si las imitas, el público ve una sola voz.</li>'+
  '<li><b>Idea, no palabras.</b> Espera a oír la oración entera y di la idea con lo que tienes. Si una palabra no sale, usa una más simple: «fabulosas riquezas» → <span class="gu">ઘણા પૈસા</span>.</li>'+
  '<li><b>Oraciones cortas.</b> Si él encadena tres ideas, tú haz tres oraciones. El gujarati lo agradece.</li>'+
  '<li><b>Habla en primera persona</b>, como si fueras él: «yo», «nosotros», «ustedes».</li>'+
  '<li><b>Números en lakh y crore:</b> 9,2 millones = <span class="gu">૯૨ લાખ</span>. Míralo en «Números».</li>'+
  '<li><b>Textos:</b> léelos tú en la Biblia en gujarati, ya marcados. No traduzcas su lectura.</li>'+
  '<li>Lo tachado en sus notas (Eva, los ángeles, las «otras ovejas»…) no se dice. Si aun así lo menciona, la pestaña de cada día trae las palabras.</li></ul></div>'+
  '<div class="row"><span class="sub">Velocidad del audio:</span><select id="vel"><option value="0.85">Más lento</option><option value="1">Normal</option><option value="1.15">Más rápido</option></select></div>';
  app.innerHTML=h;
  var s=document.getElementById('vel');s.value=String(L('vel',1));s.onchange=function(){G('vel',+s.value);toast('Velocidad guardada');};
}

/* ── UN DÍA ── */
function dia(d){
  var fr=frasesDe(d.sec), vo=D.vocab.filter(function(v){return v.dia===d.n;}), sv=D.salv.slice(d.salv[0],d.salv[1]);
  var ml=malas(), prev=D.frases.filter(function(f){return f.dia<d.n&&ml[f.id];});
  var h='<div><div class="eyebrow">Día '+d.n+' · '+d.f+'</div><h1>'+E(d.t)+'</h1></div><p class="sub">'+E(d.obj)+'</p>';
  h+='<div class="panel pims"><div class="eyebrow">🎧 Audio del día · sin pantalla</div><p class="sub">Para el carro o una caminata. Lucía te pregunta en español, tú lo dices en gujarati en el silencio y luego oyes la respuesta. Las palabras vuelven a los pocos segundos, al minuto y a los 5 minutos.</p>'+
     d.pims.map(function(x){return'<div class="pims-it"><span>'+E(x[1])+'</span><audio controls preload="none" src="audio/'+x[0]+'.mp3'+(x[2]||'')+'"></audio></div>';}).join('')+'</div>';
  // paso 1
  h+='<h2><small>Paso 1 · 8 min</small>Vocabulario</h2><p class="sub">Lee el español, di el gujarati en voz alta y toca para comprobar.</p>'+
     '<div class="row"><label class="sw"><input type="checkbox" id="ocv" checked> Ocultar gujarati</label></div>'+
     '<div class="lista oculto" id="lv">'+vo.map(function(v){return'<div class="it"><div class="tx"><span class="es">'+E(v.es)+'</span><span class="gu">'+E(v.gu)+'</span></div><button class="play gup" data-a="'+v.a+'" aria-label="Escuchar">▶</button></div>';}).join('')+'</div>';

function enlazarPlays(raiz){raiz.querySelectorAll('.play[data-a],.pz-a[data-a]').forEach(function(b){b.onclick=function(){parar();oir(b.dataset.a,b);};});}
function repetirTodas(btn,fr){
  if(btn.classList.contains('on')){parar();btn.classList.remove('on');btn.textContent='▶ Repetir todas';return;}
  parar();var c=cancel;btn.classList.add('on');btn.textContent='■ Parar';
  var i=0;
  (function sig(){
    if(c!==cancel)return;
    if(i>=fr.length){btn.classList.remove('on');btn.textContent='▶ Repetir todas';return;}
    var f=fr[i++],it=document.querySelector('#lf .it[data-id="'+f.id+'"]'),b=it&&it.querySelector('.play');
    if(it)it.scrollIntoView({block:'center',behavior:'smooth'});
    oir(f.a,b).then(function(dur){if(c!==cancel)return;return esperar(Math.max(1500,dur*1000*1.1/(L('vel',1))+500));}).then(sig,function(){});
  })();
}

/* ── TALLER: oír español → decir gujarati → comparar ── */
function taller(cont,lista,clave){
  var cola=lista.slice(), hechas=0, total=lista.length, ocultarEs=L('ocultarEs',false);
  function pintar(){
    parar();
    if(!cola.length){cont.innerHTML='<div class="taller"><b>¡Terminaste esta ronda! 🎉</b><p class="sub">'+total+' frases. Puedes hacer otra ronda: la segunda siempre sale más rápido.</p><div class="row"><button class="pri" id="otra_'+clave+'">Otra ronda</button></div></div>';
      document.getElementById('otra_'+clave).onclick=function(){cola=lista.slice();hechas=0;pintar();};return;}
    var f=cola[0];
    cont.innerHTML='<div class="taller"><div class="cont"><span>'+(hechas+1)+' de '+(total+Math.max(0,cola.length-(total-hechas)))+'</span><label class="sw"><input type="checkbox" class="oes"'+(ocultarEs?' checked':'')+'> Solo audio (sin texto en español)</label></div>'+
      '<div class="barra"><i style="width:'+Math.round(100*hechas/total)+'%"></i></div>'+
      '<div class="row"><button class="play es" aria-label="Oír al discursante">▶</button><span class="fase es">El discursante</span></div>'+
      '<div class="esq"'+(ocultarEs?' hidden':'')+'>«'+E(f.es)+'»</div>'+
      '<div class="row"><button class="pri ver">Ya lo dije · comparar</button></div>'+
      '<div class="resp" hidden><div class="row"><button class="play gup" aria-label="Oír el modelo">▶</button><span class="fase mod">Así puede sonar</span></div><div class="gu">'+guC(f)+'</div>'+(f.nota?'<div class="nota sub">'+E(f.nota)+'</div>':'')+
      '<div class="row" style="margin-top:6px"><button class="ok bien">✓ Me salió</button><button class="bad mal">↺ Repasar</button></div></div></div>';
    var pe=cont.querySelector('.play.es'),pg=cont.querySelector('.play.gup'),resp=cont.querySelector('.resp');
    pe.onclick=function(){parar();oir(f.aes,pe);};
    pg.onclick=function(){parar();oir(f.a,pg);};
    cont.querySelector('.oes').onchange=function(){ocultarEs=this.checked;G('ocultarEs',ocultarEs);cont.querySelector('.esq').hidden=ocultarEs;};
    cont.querySelector('.ver').onclick=function(){resp.hidden=false;this.hidden=true;parar();oir(f.a,pg);};
    cont.querySelector('.bien').onclick=function(){var m=malas();delete m[f.id];G('malas',m);cola.shift();hechas++;pintar();};
    cont.querySelector('.mal').onclick=function(){var m=malas();m[f.id]=1;G('malas',m);cola.push(cola.shift());pintar();toast('Vuelve al final');};
    if(pintar.ya)oir(f.aes,pe);
    pintar.ya=true;
  }
  pintar.ya=false;pintar();
}

function simulacro(){
  var cfg=L('sim',{pausa:1.3,modelo:true,desde:0});
  var h='<div><div class="eyebrow">Día 5 · Vie 27</div><h1>Simulacro del discurso</h1></div>'+
  '<p class="sub">Todo el discurso seguido, como el domingo: habla el discursante, tú interpretas en la pausa y luego (si quieres) oyes el modelo. Hazlo dos veces: la primera con el modelo, la segunda sin él. Después, practica con el hermano.</p>'+
  '<div class="panel row"><label class="sw">Tu pausa <select id="pausa"><option value="1">corta</option><option value="1.3">normal</option><option value="1.7">larga</option></select></label>'+
  '<label class="sw"><input type="checkbox" id="mod"> Oír el modelo en gujarati</label>'+
  '<label class="sw">Empezar en <select id="desde">'+D.secs.map(function(s){var i=D.frases.findIndex(function(f){return f.sec===s.id;});return'<option value="'+i+'">'+E(s.titulo)+'</option>';}).join('')+'</select></label></div>'+
  '<div class="taller cabina"><div class="cont"><span id="pos">Listo</span><span id="sec"></span></div><div class="barra"><i id="bar"></i></div>'+
  '<div class="fase" id="fase">Pulsa «Empezar»</div><div class="esq" id="txt"></div><div class="gu" id="mtx" hidden></div><div class="reloj" id="reloj" hidden></div>'+
  '<div class="row"><button class="pri" id="go">▶ Empezar</button><button id="pa" hidden>⏸ Pausa</button><button id="sk" hidden>Siguiente ⏭</button></div></div>'+
  '<h2><small>Sin pantalla</small>El domingo, en la cabina</h2><p class="sub">Lleva impresas solo tus palabras clave del día 1 al 4, no las oraciones: las oraciones te atan al papel. Mira al público y a sus manos.</p>';
  app.innerHTML=h;
  var $=function(i){return document.getElementById(i);};
  $('pausa').value=String(cfg.pausa);$('mod').checked=cfg.modelo;$('desde').value=String(cfg.desde);
  function save(){cfg={pausa:+$('pausa').value,modelo:$('mod').checked,desde:+$('desde').value};G('sim',cfg);}
  ['pausa','mod','desde'].forEach(function(i){$(i).onchange=save;});
  var i=0,corriendo=false,pausado=false;
  function fin(){corriendo=false;$('go').hidden=false;$('go').textContent='▶ Otra vez';$('pa').hidden=true;$('sk').hidden=true;$('fase').textContent='¡Discurso completo! 🎉';$('fase').className='fase mod';$('txt').textContent='';$('mtx').hidden=true;$('reloj').hidden=true;}
  function paso(){
    if(!corriendo||pausado)return;
    if(i>=D.frases.length)return fin();
    var f=D.frases[i],c;
    $('pos').textContent=(i+1)+' de '+D.frases.length;$('sec').textContent=secTitulo(f.sec);$('bar').style.width=Math.round(100*i/D.frases.length)+'%';
    $('fase').textContent='Habla el discursante';$('fase').className='fase es';$('txt').textContent='«'+f.es+'»';$('mtx').hidden=true;$('reloj').hidden=true;
    parar();c=cancel;
    oir(f.aes).then(function(dur){
      if(c!==cancel)return Promise.reject('x');
      var ms=Math.max(2500,dur*1000*cfg.pausa*1.35/L('vel',1));
      $('fase').textContent='Tu turno: dilo en gujarati';$('fase').className='fase tu';$('reloj').hidden=false;
      var t0=Date.now();var tk=setInterval(function(){var r=Math.max(0,ms-(Date.now()-t0));$('reloj').textContent=(r/1000).toFixed(1)+' s';if(r<=0||c!==cancel)clearInterval(tk);},100);
      return esperar(ms);
    }).then(function(){
      $('reloj').hidden=true;
      if(!cfg.modelo)return;
      $('fase').textContent='Así puede sonar';$('fase').className='fase mod';$('mtx').hidden=false;$('mtx').textContent=f.gu;
      return oir(f.a).then(function(){return esperar(600);});
    }).then(function(){if(c!==cancel)return;i++;paso();},function(){});
  }
  $('go').onclick=function(){save();i=cfg.desde;corriendo=true;pausado=false;$('go').hidden=true;$('pa').hidden=false;$('sk').hidden=false;$('pa').textContent='⏸ Pausa';paso();};
  $('pa').onclick=function(){if(!pausado){pausado=true;parar();this.textContent='▶ Seguir';$('fase').textContent='En pausa';}else{pausado=false;this.textContent='⏸ Pausa';paso();}};
  $('sk').onclick=function(){parar();i++;if(!pausado)paso();};
}
